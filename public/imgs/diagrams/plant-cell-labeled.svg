      <ellipse cx="208" cy="166" rx="25" ry="14" transform="rotate(19 208 166)"/>
      <ellipse cx="390" cy="176" rx="25" ry="14" transform="rotate(-23 390 176)"/>
      <ellipse cx="437" cy="249" rx="25" ry="14" transform="rotate(27 437 249)"/>
      <ellipse cx="419" cy="369" rx="25" ry="14" transform="rotate(-23 419 369)"/>
      <ellipse cx="180" cy="396" rx="25" ry="14" transform="rotate(18 180 396)"/>
    </g>
    <g stroke="#d6ec9c" stroke-width="3" opacity=".9">
      <path d="M150 207h36M190 157l35 18M373 181h35M419 238l35 19M400 363h37M162 389l35 16"/>
