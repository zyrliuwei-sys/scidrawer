    <rect x="117" y="115" width="365" height="358" rx="80" fill="#9fc57e" stroke="#dcebc8" stroke-width="4"/>
    <rect x="132" y="130" width="335" height="328" rx="67" fill="#d7e9b9" stroke="#669f67" stroke-width="3"/>
    <path d="M175 158C237 124 355 132 418 183C454 213 447 358 409 404C341 464 231 449 174 399C137 367 137 211 175 158Z" fill="url(#vacuole)" stroke="#539d92" stroke-width="4"/>
    <ellipse cx="278" cy="307" rx="63" ry="58" fill="#b78cc7" stroke="#764e97" stroke-width="4"/>
    <circle cx="289" cy="295" r="18" fill="#72558f"/>
    <path d="M219 255c-22 9-35 23-42 47M215 276c-20 13-31 30-31 53M226 365c-17 4-35 19-42 37M339 247c20-16 44-23 68-17M339 386c24-2 42 8 56 27" fill="none" stroke="#6c78a4" stroke-width="10" stroke-linecap="round"/>
