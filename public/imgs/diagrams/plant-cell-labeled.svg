<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Plant cell labeled diagram</title>
  <desc id="desc">A plant cell diagram showing the cell wall, chloroplasts, vacuole, nucleus, and other organelles.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5e9"/>
      <stop offset="1" stop-color="#dce8cd"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5d8b50"/>
      <stop offset="1" stop-color="#346840"/>
    </linearGradient>
    <linearGradient id="vacuole" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#bfe3df"/>
      <stop offset="1" stop-color="#79bfb9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#2f5037" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#background)"/>
  <g fill="none" stroke="#799879" stroke-width="1" opacity=".35">
    <path d="M35 76h102M35 99h75M462 74h104M486 100h80M31 510h104M461 531h104"/>
