<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Graphical abstract layout">
  <defs>
    <linearGradient id="ga-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <marker id="ga-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="700" height="340" rx="14" fill="url(#ga-bg)" stroke="#cbd5e1" stroke-width="1"/>
  <g transform="translate(30, 36)">
    <text font-size="13" font-weight="800" fill="#0f172a" letter-spacing="0.3" font-family="ui-sans-serif, system-ui, sans-serif">mRNA-LNP vaccine induces durable antibody response</text>
    <text y="18" font-size="10" fill="#475569" font-family="ui-sans-serif, system-ui, sans-serif">From lipid formulation to in vivo expression</text>
  </g>
  <line x1="30" y1="80" x2="690" y2="80" stroke="#cbd5e1" stroke-width="1"/>
  <g transform="translate(40, 110)">
    <rect width="180" height="220" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="22" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.5" font-family="ui-sans-serif, system-ui, sans-serif">1. FORMULATION</text>
    <g transform="translate(90, 90)">
      <circle r="42" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
      <circle r="30" fill="#fff" stroke="#0ea5e9" stroke-width="1" opacity="0.7"/>
      <circle r="14" fill="#0369a1" opacity="0.85"/>
      <text y="3" font-size="8" font-weight="700" fill="#fff" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">mRNA</text>
      <circle cx="38" cy="0" r="3" fill="#0369a1"/>
      <circle cx="32.86" cy="19" r="3" fill="#0369a1"/>
      <circle cx="19" cy="32.86" r="3" fill="#0369a1"/>
      <circle cx="0" cy="38" r="3" fill="#0369a1"/>
      <circle cx="-19" cy="32.86" r="3" fill="#0369a1"/>
      <circle cx="-32.86" cy="19" r="3" fill="#0369a1"/>
      <circle cx="-38" cy="0" r="3" fill="#0369a1"/>
      <circle cx="-32.86" cy="-19" r="3" fill="#0369a1"/>
      <circle cx="-19" cy="-32.86" r="3" fill="#0369a1"/>
      <circle cx="0" cy="-38" r="3" fill="#0369a1"/>
      <circle cx="19" cy="-32.86" r="3" fill="#0369a1"/>
      <circle cx="32.86" cy="-19" r="3" fill="#0369a1"/>
    </g>
    <text x="90" y="200" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">Lipid nanoparticle</text>
  </g>
  <g transform="translate(240, 110)">
    <rect width="180" height="220" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="22" font-size="10" font-weight="700" fill="#0d9488" letter-spacing="0.5" font-family="ui-sans-serif, system-ui, sans-serif">2. DELIVERY</text>
    <g transform="translate(40, 60)">
      <rect width="100" height="20" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
      <rect x="100" width="20" height="20" fill="#475569"/>
      <rect x="-30" y="6" width="30" height="8" fill="#0369a1"/>
      <line x1="-30" y1="10" x2="-50" y2="10" stroke="#0f172a" stroke-width="1.5"/>
    </g>
    <g transform="translate(60, 110)">
      <ellipse cx="30" cy="20" rx="50" ry="22" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
      <ellipse cx="30" cy="20" rx="38" ry="14" fill="none" stroke="#e11d48" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="30" y="60" font-size="9" font-weight="600" fill="#0f172a" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">Skeletal muscle</text>
    </g>
    <text x="90" y="200" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">Intramuscular injection</text>
  </g>
  <g transform="translate(440, 110)">
    <rect width="180" height="220" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="22" font-size="10" font-weight="700" fill="#d97706" letter-spacing="0.5" font-family="ui-sans-serif, system-ui, sans-serif">3. EXPRESSION</text>
    <g transform="translate(60, 70)">
      <ellipse cx="30" cy="30" rx="36" ry="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <ellipse cx="30" cy="30" rx="14" ry="12" fill="#f59e0b" opacity="0.5"/>
      <g transform="translate(30, 30)">
        <path d="M 0 0 L 0 -10 M 0 0 L -5 6 M 0 0 L 5 6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
    </g>
    <g transform="translate(20, 145)">
      <path d="M 0 30 Q 30 25 60 18 Q 90 10 130 4" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
      <circle cx="0" cy="30" r="3" fill="#f59e0b"/>
      <circle cx="130" cy="4" r="3" fill="#f59e0b"/>
      <text x="0" y="48" font-size="9" fill="#475569" font-family="ui-sans-serif, system-ui, sans-serif">Day 0</text>
      <text x="120" y="48" font-size="9" fill="#475569" font-family="ui-sans-serif, system-ui, sans-serif">Day 28</text>
    </g>
    <text x="90" y="200" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">Antigen expression</text>
  </g>
  <g>
    <line x1="222" y1="220" x2="238" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#ga-arrow)"/>
    <line x1="422" y1="220" x2="438" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#ga-arrow)"/>
  </g>
  <g transform="translate(30, 300)">
    <rect width="660" height="36" rx="6" fill="#0f172a"/>
    <text x="20" y="22" font-size="11" font-weight="700" fill="#fff" font-family="ui-sans-serif, system-ui, sans-serif">Durable neutralizing antibody titer at 6 months</text>
    <g transform="translate(540, 11)">
      <rect x="0" y="14" width="10" height="4" fill="#14b8a6" opacity="0.6" rx="1"/>
      <rect x="18" y="12" width="10" height="5.5" fill="#14b8a6" opacity="0.68" rx="1"/>
      <rect x="36" y="10" width="10" height="7" fill="#14b8a6" opacity="0.76" rx="1"/>
      <rect x="54" y="8" width="10" height="8.5" fill="#14b8a6" opacity="0.84" rx="1"/>
      <rect x="72" y="6" width="10" height="10" fill="#14b8a6" opacity="0.92" rx="1"/>
    </g>
  </g>
</svg>
