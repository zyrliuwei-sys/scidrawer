<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Preserve connections when redrawing a sketch</title><desc id="desc">The same A-to-B-to-C structure appears in rough and clean versions, with preserved and improved properties listed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="960" height="640" fill="#fbfaf7"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="48" y="49" font-size="16" fill="#257c7d" font-weight="700" letter-spacing="2">FIELD GUIDE / 05</text><text x="48" y="100" font-size="34" fill="#183344" font-weight="700">Preserve the structure. Improve the drawing.</text><text x="48" y="135" font-size="21" fill="#526673" >Compare the reference and the result before changing style</text><rect x="48" y="179" width="406" height="253" rx="18" fill="#f4f1e9" stroke="#d9e2e3" stroke-width="2"/><rect x="506" y="179" width="406" height="253" rx="18" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><text x="70" y="218" font-size="26" fill="#183344" font-weight="700">Sketch reference</text><text x="528" y="218" font-size="26" fill="#183344" font-weight="700">Reviewed diagram</text><path d="M80 275Q103 261 137 274L143 329Q110 343 80 330ZM213 272L280 275L278 333L216 337ZM346 275Q378 265 411 273L414 330Q378 340 348 333Z" fill="none" stroke="#71716b" stroke-width="2.5"/><text x="111" y="313" font-size="28" fill="#71716b" text-anchor="middle">A</text><text x="247" y="313" font-size="28" fill="#71716b" text-anchor="middle">B</text><text x="380" y="313" font-size="28" fill="#71716b" text-anchor="middle">C</text><path d="M153 305 L202 305" fill="none" stroke="#71716b" stroke-width="3" marker-end="url(#arrow)" /><path d="M292 305 L336 305" fill="none" stroke="#71716b" stroke-width="3" marker-end="url(#arrow)" /><rect x="538" y="274" width="60" height="61" rx="12" fill="#e3f2ed" stroke="#d9e2e3" stroke-width="2"/><text x="568" y="314" font-size="28" fill="#183344" text-anchor="middle">A</text><rect x="679" y="274" width="60" height="61" rx="12" fill="#eee8f7" stroke="#d9e2e3" stroke-width="2"/><text x="709" y="314" font-size="28" fill="#183344" text-anchor="middle">B</text><rect x="820" y="274" width="60" height="61" rx="12" fill="#fae9df" stroke="#d9e2e3" stroke-width="2"/><text x="850" y="314" font-size="28" fill="#183344" text-anchor="middle">C</text><path d="M610 305 L667 305" fill="none" stroke="#183344" stroke-width="3" marker-end="url(#arrow)" /><path d="M751 305 L808 305" fill="none" stroke="#183344" stroke-width="3" marker-end="url(#arrow)" /><text x="251" y="394" font-size="23" fill="#526673" text-anchor="middle">A → B → C</text><text x="709" y="394" font-size="23" fill="#257c7d" text-anchor="middle">A → B → C</text><path d="M467 305 L493 305" fill="none" stroke="#257c7d" stroke-width="3" marker-end="url(#arrow)" /><rect x="48" y="464" width="864" height="130" rx="18" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><text x="73" y="502" font-size="18" fill="#257c7d" font-weight="700" letter-spacing="1.5">PRESERVE</text><text x="73" y="541" font-size="24" fill="#183344" >3 objects · 2 connections</text><text x="73" y="574" font-size="22" fill="#526673" >Direction and exact labels</text><path d="M476 486 L476 573" fill="none" stroke="#d9e2e3" stroke-width="3" /><text x="504" y="502" font-size="18" fill="#7864a0" font-weight="700" letter-spacing="1.5">IMPROVE</text><text x="504" y="541" font-size="23" fill="#183344" >Spacing · alignment · line quality</text><text x="504" y="574" font-size="22" fill="#526673" >Readability and visual consistency</text></g></svg>