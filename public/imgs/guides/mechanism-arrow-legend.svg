<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Four connector meanings in a mechanism diagram</title><desc id="desc">Examples of activation, inhibition, a proposed connection, and transport across a boundary.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="960" height="640" fill="#fbfaf7"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="48" y="49" font-size="16" fill="#257c7d" font-weight="700" letter-spacing="2">FIELD GUIDE / 03</text><text x="48" y="100" font-size="34" fill="#183344" font-weight="700">Make every connector mean something</text><text x="48" y="135" font-size="21" fill="#526673" >Example conventions for a hypothetical mechanism</text><rect x="48" y="176" width="416" height="175" rx="18" fill="#e3f2ed" stroke="#d9e2e3" stroke-width="2"/><text x="70" y="213" font-size="26" fill="#183344" font-weight="700">Activation</text><text x="70" y="327" font-size="21" fill="#526673" >A activates B</text><rect x="496" y="176" width="416" height="175" rx="18" fill="#fae9df" stroke="#d9e2e3" stroke-width="2"/><text x="518" y="213" font-size="26" fill="#183344" font-weight="700">Inhibition</text><text x="518" y="327" font-size="21" fill="#526673" >A inhibits B</text><rect x="48" y="373" width="416" height="175" rx="18" fill="#eee8f7" stroke="#d9e2e3" stroke-width="2"/><text x="70" y="410" font-size="26" fill="#183344" font-weight="700">Proposed connection</text><text x="70" y="524" font-size="21" fill="#526673" >A may affect B</text><rect x="496" y="373" width="416" height="175" rx="18" fill="#e3f2ed" stroke="#d9e2e3" stroke-width="2"/><text x="518" y="410" font-size="26" fill="#183344" font-weight="700">Transport</text><text x="518" y="524" font-size="21" fill="#526673" >Movement across a boundary</text><circle cx="113" cy="260" r="24" fill="#fff" stroke="#183344" stroke-width="2.5"/><text x="113" y="268" font-size="24" fill="#183344" text-anchor="middle">A</text><circle cx="395" cy="260" r="24" fill="#fff" stroke="#183344" stroke-width="2.5"/><text x="395" y="268" font-size="24" fill="#183344" text-anchor="middle">B</text><path d="M147 260 L361 260" fill="none" stroke="#183344" stroke-width="3" marker-end="url(#arrow)" /><circle cx="561" cy="260" r="24" fill="#fff" stroke="#183344" stroke-width="2.5"/><text x="561" y="268" font-size="24" fill="#183344" text-anchor="middle">A</text><circle cx="843" cy="260" r="24" fill="#fff" stroke="#183344" stroke-width="2.5"/><text x="843" y="268" font-size="24" fill="#183344" text-anchor="middle">B</text><path d="M595 260 L804 260" fill="none" stroke="#b75d3d" stroke-width="3" /><path d="M804 241 L804 279" fill="none" stroke="#b75d3d" stroke-width="3" /><circle cx="113" cy="457" r="24" fill="#fff" stroke="#183344" stroke-width="2.5"/><text x="113" y="465" font-size="24" fill="#183344" text-anchor="middle">A</text><circle cx="395" cy="457" r="24" fill="#fff" stroke="#183344" stroke-width="2.5"/><text x="395" y="465" font-size="24" fill="#183344" text-anchor="middle">B</text><path d="M147 457 L361 457" fill="none" stroke="#7864a0" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 7"/><path d="M708 424 L708 490" fill="none" stroke="#d9e2e3" stroke-width="3" /><path d="M720 424 L720 490" fill="none" stroke="#d9e2e3" stroke-width="3" /><circle cx="561" cy="457" r="24" fill="#fff" stroke="#183344" stroke-width="2.5"/><text x="561" y="465" font-size="24" fill="#183344" text-anchor="middle">A</text><circle cx="843" cy="457" r="24" fill="#fff" stroke="#183344" stroke-width="2.5"/><text x="843" y="465" font-size="24" fill="#183344" text-anchor="middle">A</text><path d="M595 457 L809 457" fill="none" stroke="#257c7d" stroke-width="3" marker-end="url(#arrow)" /><text x="48" y="601" font-size="23" fill="#526673" >Define the legend for your field; a shape alone is not enough.</text></g></svg>