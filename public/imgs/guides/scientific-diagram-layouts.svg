<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Four scientific diagram layouts</title><desc id="desc">Workflow, structure, mechanism, and comparison layouts, each paired with its communication question.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="960" height="640" fill="#fbfaf7"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="48" y="49" font-size="16" fill="#257c7d" font-weight="700" letter-spacing="2">FIELD GUIDE / 04</text><text x="48" y="100" font-size="34" fill="#183344" font-weight="700">Choose the layout for the question</text><text x="48" y="135" font-size="21" fill="#526673" >Four ways to organize scientific information</text><rect x="48" y="173" width="416" height="183" rx="18" fill="#e3f2ed" stroke="#d9e2e3" stroke-width="2"/><text x="70" y="209" font-size="27" fill="#183344" font-weight="700">Workflow</text><text x="70" y="330" font-size="21" fill="#526673" >What happens next?</text><rect x="496" y="173" width="416" height="183" rx="18" fill="#eee8f7" stroke="#d9e2e3" stroke-width="2"/><text x="518" y="209" font-size="27" fill="#183344" font-weight="700">Structure</text><text x="518" y="330" font-size="21" fill="#526673" >What are the parts?</text><rect x="48" y="380" width="416" height="183" rx="18" fill="#fae9df" stroke="#d9e2e3" stroke-width="2"/><text x="70" y="416" font-size="27" fill="#183344" font-weight="700">Mechanism</text><text x="70" y="537" font-size="21" fill="#526673" >What affects what?</text><rect x="496" y="380" width="416" height="183" rx="18" fill="#e3f2ed" stroke="#d9e2e3" stroke-width="2"/><text x="518" y="416" font-size="27" fill="#183344" font-weight="700">Comparison</text><text x="518" y="537" font-size="21" fill="#526673" >What changes?</text><rect x="80" y="238" width="58" height="46" rx="8" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><text x="109" y="269" font-size="23" fill="#183344" text-anchor="middle">1</text><rect x="223" y="238" width="58" height="46" rx="8" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><text x="252" y="269" font-size="23" fill="#183344" text-anchor="middle">2</text><rect x="366" y="238" width="58" height="46" rx="8" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><text x="395" y="269" font-size="23" fill="#183344" text-anchor="middle">3</text><path d="M147 261 L214 261" fill="none" stroke="#183344" stroke-width="3" marker-end="url(#arrow)" /><path d="M290 261 L357 261" fill="none" stroke="#183344" stroke-width="3" marker-end="url(#arrow)" /><circle cx="647" cy="264" r="48" fill="#fff" stroke="#7864a0" stroke-width="2.5"/><circle cx="650" cy="266" r="17" fill="#eee8f7" stroke="#7864a0" stroke-width="2.5"/><path d="M668 260 L739 239" fill="none" stroke="#7864a0" stroke-width="3" /><text x="752" y="246" font-size="20" fill="#183344" >Part A</text><path d="M688 287 L739 296" fill="none" stroke="#7864a0" stroke-width="3" /><text x="752" y="304" font-size="20" fill="#183344" >Part B</text><circle cx="110" cy="470" r="24" fill="#fff" stroke="#183344" stroke-width="2.5"/><text x="110" y="478" font-size="24" fill="#183344" text-anchor="middle">A</text><circle cx="251" cy="450" r="24" fill="#fff" stroke="#183344" stroke-width="2.5"/><text x="251" y="458" font-size="24" fill="#183344" text-anchor="middle">B</text><circle cx="394" cy="470" r="24" fill="#fff" stroke="#183344" stroke-width="2.5"/><text x="394" y="478" font-size="24" fill="#183344" text-anchor="middle">C</text><path d="M142 466 L217 452" fill="none" stroke="#183344" stroke-width="3" marker-end="url(#arrow)" /><path d="M285 452 L360 466" fill="none" stroke="#183344" stroke-width="3" marker-end="url(#arrow)" /><path d="M394 502V514H110V502" stroke="#b75d3d" stroke-width="3" fill="none"/><path d="M100 502H120" stroke="#b75d3d" stroke-width="3"/><rect x="550" y="437" width="103" height="66" rx="9" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><text x="601" y="463" font-size="18" fill="#526673" text-anchor="middle">Before</text><circle cx="576" cy="484" r="6" fill="#7864a0" stroke="#7864a0" stroke-width="2.5"/><circle cx="601" cy="484" r="6" fill="#7864a0" stroke="#7864a0" stroke-width="2.5"/><circle cx="626" cy="484" r="6" fill="#7864a0" stroke="#7864a0" stroke-width="2.5"/><rect x="754" y="437" width="103" height="66" rx="9" fill="#fff" stroke="#d9e2e3" stroke-width="2"/><text x="805" y="463" font-size="18" fill="#526673" text-anchor="middle">After</text><circle cx="780" cy="484" r="6" fill="#257c7d" stroke="#257c7d" stroke-width="2.5"/><circle cx="805" cy="484" r="6" fill="#257c7d" stroke="#257c7d" stroke-width="2.5"/><circle cx="830" cy="484" r="6" fill="#257c7d" stroke="#257c7d" stroke-width="2.5"/><path d="M675 470 L731 470" fill="none" stroke="#183344" stroke-width="3" marker-end="url(#arrow)" /><text x="48" y="611" font-size="22" fill="#526673" >Keep matching objects consistent across every panel.</text></g></svg>