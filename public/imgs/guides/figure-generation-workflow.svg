<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">From figure brief to reviewed export</title><desc id="desc">Four steps with a feedback loop from review to the figure brief.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="960" height="640" fill="#fbfaf7"/><g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="48" y="49" font-size="16" fill="#257c7d" font-weight="700" letter-spacing="2">FIELD GUIDE / 01</text><text x="48" y="100" font-size="34" fill="#183344" font-weight="700">Brief. Draft. Review. Export.</text><text x="48" y="135" font-size="21" fill="#526673" >A repeatable workflow for explanatory scientific figures</text><rect x="48" y="190" width="186" height="244" rx="18" fill="#e3f2ed" stroke="#d9e2e3" stroke-width="2"/><circle cx="86" cy="233" r="21" fill="#fff" stroke="#d9e2e3" stroke-width="2.5"/><text x="86" y="240" font-size="22" fill="#257c7d" text-anchor="middle">1</text><text x="68" y="291" font-size="29" fill="#183344" font-weight="700">Brief</text><text x="68" y="334" font-size="20" fill="#526673" >One purpose</text><text x="68" y="366" font-size="20" fill="#526673" >Exact objects</text><text x="68" y="398" font-size="20" fill="#526673" >Connections</text><path d="M241 306 L264 306" fill="none" stroke="#183344" stroke-width="3" marker-end="url(#arrow)" /><rect x="274" y="190" width="186" height="244" rx="18" fill="#eee8f7" stroke="#d9e2e3" stroke-width="2"/><circle cx="312" cy="233" r="21" fill="#fff" stroke="#d9e2e3" stroke-width="2.5"/><text x="312" y="240" font-size="22" fill="#257c7d" text-anchor="middle">2</text><text x="294" y="291" font-size="29" fill="#183344" font-weight="700">Draft</text><text x="294" y="334" font-size="20" fill="#526673" >Choose layout</text><text x="294" y="366" font-size="20" fill="#526673" >Generate image</text><text x="294" y="398" font-size="20" fill="#526673" >Inspect structure</text><path d="M467 306 L490 306" fill="none" stroke="#183344" stroke-width="3" marker-end="url(#arrow)" /><rect x="500" y="190" width="186" height="244" rx="18" fill="#fae9df" stroke="#d9e2e3" stroke-width="2"/><circle cx="538" cy="233" r="21" fill="#fff" stroke="#d9e2e3" stroke-width="2.5"/><text x="538" y="240" font-size="22" fill="#257c7d" text-anchor="middle">3</text><text x="520" y="291" font-size="29" fill="#183344" font-weight="700">Review</text><text x="520" y="334" font-size="20" fill="#526673" >Check meaning</text><text x="520" y="366" font-size="20" fill="#526673" >Verify labels</text><text x="520" y="398" font-size="20" fill="#526673" >Refine details</text><path d="M693 306 L716 306" fill="none" stroke="#183344" stroke-width="3" marker-end="url(#arrow)" /><rect x="726" y="190" width="186" height="244" rx="18" fill="#e3f2ed" stroke="#d9e2e3" stroke-width="2"/><circle cx="764" cy="233" r="21" fill="#fff" stroke="#d9e2e3" stroke-width="2.5"/><text x="764" y="240" font-size="22" fill="#257c7d" text-anchor="middle">4</text><text x="746" y="291" font-size="29" fill="#183344" font-weight="700">Export</text><text x="746" y="334" font-size="20" fill="#526673" >Check final size</text><text x="746" y="366" font-size="20" fill="#526673" >Save source</text><text x="746" y="398" font-size="20" fill="#526673" >Save final file</text><path d="M593 449V492H141V449" fill="none" stroke="#257c7d" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="370" y="531" font-size="23" fill="#257c7d" text-anchor="middle">Revise the brief when meaning changes</text><path d="M48 570 L912 570" fill="none" stroke="#d9e2e3" stroke-width="3" /><text x="48" y="608" font-size="23" fill="#526673" >Check the science before polishing the style.</text></g></svg>